name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install main deps
        run: yarn
      - name: Initialize
        run: yarn bootstrap
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
